name: Appium Android CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Nâng từ '18' lên '20' theo yêu cầu của dependencies
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Appium & Drivers
        run: |
          npm install -g appium
          appium driver update uiautomator2 || appium driver install uiautomator2

      - name: Run Android Emulator & Tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TEST_WALLET_EMAIL: ${{ secrets.TEST_WALLET_EMAIL }}
          TEST_WALLET_PASSWORD: ${{ secrets.TEST_WALLET_PASSWORD }}
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          script: |
            echo "Đang chờ emulator khởi động hoàn tất..."
            
            # Vòng lặp chờ đến khi Android boot xong 100%
            until adb shell getprop sys.boot_completed 2>&1 | grep -q "1"; do
              sleep 5
            done
            
            echo "Emulator đã sẵn sàng! Đang mở khóa màn hình..."
            adb shell input keyevent 82
            
            # Cài đặt file APK của Moonstake Mobile
            echo "Đang cài đặt app..."
            adb install ./app/moonstake.apk
            
            # Chạy lệnh test WebdriverIO
            echo "Bắt đầu chạy test suite..."
            npm run send

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/